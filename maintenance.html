<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>FK Riteriai Pathway — Half-Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07101e;--surface:#0d1a2d;--green:#c8ff00;
  --text:#e8f0f8;--text2:#7a92aa;--text3:#4a6070;
  --border:rgba(255,255,255,0.07);
}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;line-height:1.6}

/* Background canvas with falling/bouncing balls */
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* Pitch lines */
.pitch{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.08}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--text);transform:translateX(-50%)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:min(60vw,420px);aspect-ratio:1;border:2px solid var(--text);border-radius:50%;transform:translate(-50%,-50%)}

.glow{position:fixed;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(200,255,0,.08) 0%,transparent 60%);z-index:0;pointer-events:none}

main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px}

.logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:.5px;margin-bottom:40px}
.logo span{color:var(--green)}

/* Juggling ball */
.stage{position:relative;width:140px;height:170px;margin-bottom:28px}
.ball{position:absolute;left:50%;top:0;width:76px;height:76px;margin-left:-38px;animation:bounce 1.1s cubic-bezier(.5,0,.5,1) infinite}
.ball svg{width:100%;height:100%;animation:spin 1.1s linear infinite;filter:drop-shadow(0 6px 18px rgba(200,255,0,.25))}
.shadow{position:absolute;left:50%;bottom:4px;width:70px;height:12px;margin-left:-35px;border-radius:50%;background:rgba(0,0,0,.55);animation:shadow 1.1s cubic-bezier(.5,0,.5,1) infinite}
@keyframes bounce{
  0%,100%{transform:translateY(0) scale(1,1)}
  45%{transform:translateY(80px) scale(1,1)}
  50%{transform:translateY(88px) scale(1.12,.86)}
  55%{transform:translateY(80px) scale(1,1)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shadow{
  0%,100%{transform:scale(.45);opacity:.35}
  50%{transform:scale(1);opacity:.8}
}

.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.3);color:var(--green);padding:8px 18px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:22px}
.badge-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(52px,10vw,112px);font-weight:900;line-height:.9;text-transform:uppercase;letter-spacing:-1px;margin-bottom:22px}
h1 .g{color:var(--green)}
.sub{color:var(--text2);font-size:clamp(15px,1.6vw,18px);max-width:520px;margin:0 auto 36px}

/* Scoreboard */
.board{display:inline-flex;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
.board div{padding:14px 22px}
.board .lbl{font-size:13px;letter-spacing:2px;color:var(--text3);font-weight:700;display:flex;align-items:center}
.board .clock{font-size:34px;font-weight:900;color:var(--green);border-left:1px solid var(--border);border-right:1px solid var(--border);min-width:120px;font-variant-numeric:tabular-nums}
.board .st{font-size:13px;letter-spacing:2px;color:var(--text2);font-weight:700;display:flex;align-items:center}

footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--text3);z-index:1;padding:0 16px}

@media (max-width:480px){
  .board div{padding:12px 14px}
  .board .clock{font-size:28px;min-width:96px}
}
@media (prefers-reduced-motion:reduce){
  .ball,.ball svg,.shadow,.badge-dot{animation:none}
  .ball{transform:translateY(80px)}
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="pitch" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<main>
  <div class="logo">FK RITERIAI <span>PATHWAY</span></div>

  <div class="stage" aria-hidden="true">
    <div class="ball">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="c"><circle cx="50" cy="50" r="48"/></clipPath></defs>
        <circle cx="50" cy="50" r="48" fill="#f4f7fa"/>
        <g clip-path="url(#c)" fill="#07101e">
          <polygon points="50,33 66,45 60,64 40,64 34,45"/>
          <polygon points="50,2 62,10 58,22 42,22 38,10"/>
          <polygon points="88,32 98,44 94,58 84,54 80,40"/>
          <polygon points="76,82 72,96 58,98 56,86 66,76"/>
          <polygon points="24,82 34,76 44,86 42,98 28,96"/>
          <polygon points="12,32 20,40 16,54 6,58 2,44"/>
        </g>
        <g clip-path="url(#c)" stroke="#07101e" stroke-width="2" fill="none">
          <path d="M50 33 L50 22 M66 45 L80 40 M60 64 L66 76 M40 64 L34 76 M34 45 L20 40"/>
        </g>
        <circle cx="50" cy="50" r="48" fill="none" stroke="#07101e" stroke-width="2"/>
        <ellipse cx="34" cy="26" rx="14" ry="8" fill="#fff" opacity=".35" transform="rotate(-30 34 26)"/>
      </svg>
    </div>
    <div class="shadow"></div>
  </div>

  <div class="badge"><span class="badge-dot"></span>Scheduled Maintenance</div>
  <h1>It's <span class="g">Half-Time</span></h1>
  <p class="sub">We're in the dressing room making a few tactical changes to the site. We'll be back on the pitch shortly. Thanks for your patience.</p>

  <div class="board" role="status" aria-live="off">
    <div class="lbl">Break</div>
    <div class="clock" id="clock">45:00</div>
    <div class="st">Back Soon</div>
  </div>
</main>

<footer>&copy; <span id="yr"></span> FK Riteriai Pathway &middot; Vilnius, Lithuania</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

// Match clock counting up from 45:00 (stoppage time feel)
(function(){
  var el = document.getElementById('clock'), start = Date.now();
  setInterval(function(){
    var s = Math.floor((Date.now() - start) / 1000) + 45 * 60;
    var m = Math.floor(s / 60), sec = s % 60;
    el.textContent = m + ':' + (sec < 10 ? '0' : '') + sec;
  }, 1000);
})();

// Background: footballs dropping, bouncing and rolling across the pitch
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('field'), ctx = cv.getContext('2d');
  var W, H, dpr = Math.min(window.devicePixelRatio || 1, 2), balls = [];

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  function spawn(x, y){
    var r = 10 + Math.random() * 16;
    balls.push({
      x: x != null ? x : Math.random() * W,
      y: y != null ? y : -r - Math.random() * H * 0.5,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 2,
      r: r, a: Math.random() * Math.PI * 2,
      alpha: 0.12 + Math.random() * 0.18,
      life: 0
    });
  }

  var count = W < 600 ? 7 : 14;
  for (var i = 0; i < count; i++) spawn();

  // Click/tap anywhere to kick in a new ball
  window.addEventListener('pointerdown', function(e){
    spawn(e.clientX, e.clientY);
    var b = balls[balls.length - 1]; b.vy = -8; b.vx = (Math.random() - 0.5) * 10; b.alpha = 0.5;
  });

  function drawBall(b){
    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.translate(b.x, b.y); ctx.rotate(b.a);
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fillStyle = '#e8f0f8'; ctx.fill();
    ctx.clip();
    ctx.fillStyle = '#07101e';
    pent(0, 0, b.r * 0.36);
    for (var k = 0; k < 5; k++){
      var ang = k * Math.PI * 2 / 5 - Math.PI / 2;
      pent(Math.cos(ang) * b.r * 0.95, Math.sin(ang) * b.r * 0.95, b.r * 0.3);
    }
    ctx.restore();
  }
  function pent(cx, cy, s){
    ctx.beginPath();
    for (var k = 0; k < 5; k++){
      var ang = k * Math.PI * 2 / 5 - Math.PI / 2;
      ctx.lineTo(cx + Math.cos(ang) * s, cy + Math.sin(ang) * s);
    }
    ctx.closePath(); ctx.fill();
  }

  function tick(){
    ctx.clearRect(0, 0, W, H);
    for (var i = balls.length - 1; i >= 0; i--){
      var b = balls[i];
      b.vy += 0.25; b.x += b.vx; b.y += b.vy; b.life++;
      b.a += b.vx / b.r;
      if (b.y + b.r > H){ b.y = H - b.r; b.vy *= -0.72; b.vx *= 0.99; if (Math.abs(b.vy) < 1.2) b.vy = -(7 + Math.random() * 6); }
      if (b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx); }
      if (b.x + b.r > W){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      drawBall(b);
      if (b.life > 1200){ balls.splice(i, 1); spawn(); }
    }
    if (balls.length > 40) balls.splice(0, balls.length - 40);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
